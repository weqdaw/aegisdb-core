[package]
name = "aegisdb"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.7"
rocksdb = "0.21"
async-trait = "0.1"
anyhow = "1.0"
bytes = "1.0"
tokio = { version = "1", features = ["full"] }
dashmap = "5.5"
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
bincode = "1.3"
thiserror = "1.0"
parking_lot = "0.12"
tempfile = "3.8"
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
clap = { version = "4.4", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-stream = "0.1"
sysinfo = "0.30"
chrono = "0.4"
colored = "2"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "aegisdb"
path = "src/bin/aegisdb.rs"

[[bin]]
name = "aegisdb_server"
path = "src/bin/aegisdb_server.rs"

[[bin]]
name = "aegisdb_cli"
path = "src/bin/aegisdb_cli.rs"

[[bin]]
name = "aegisdb_test"
path = "src/main.rs"

[[bin]]
name = "pd_server"
path = "src/bin/pd_server.rs"